# IncuBrix Configuration-Driven Destination Catalogue
# Stores destination profiles, policies, capabilities, and certification status.
# Secrets are referenced via environment variable names (e.g. env:DEVTO_API_KEY) and NEVER stored directly.

destinations:
  - id: "discourse_dev_forum"
    connector_key: "discourse"
    name: "Developer Discourse Community"
    audience: "Software developers, open source contributors"
    base_url: "https://meta.discourse.org"
    surface: "topic"
    content_type: "markdown"
    auth_ref: "env:DISCOURSE_API_KEY"
    auth_user_ref: "env:DISCOURSE_API_USERNAME"
    rate_limits:
      requests_per_minute: 20
    format_limits:
      max_title_length: 255
      min_title_length: 5
      max_body_length: 32000
      min_body_length: 20
    posting_rules:
      max_posts_per_window: 5
      window_seconds: 3600
      weekly_frequency_cap: 10
      allow_self_promotion: false
      allow_links: true
      require_ai_disclosure: true
      min_text_length: 20
    capabilities:
      publish: true
      get_status: true
      delete: true
      fetch_metrics: true
    certification_status: "certified"
    evidence_ref: "EVIDENCE/discourse_cert_20261017.json"

